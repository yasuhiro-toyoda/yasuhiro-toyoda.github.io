<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1108" width="760" height="1108" role="img" aria-labelledby="title desc"><title id="title">パスキーでログインする流れ</title><desc id="desc">同じスマートフォンのブラウザーと認証器を使い、端末での本人確認を必須にした例。秘密鍵は認証器側、公開鍵はサイト側にある。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#557b60"/></marker></defs><rect width="760" height="1108" rx="18" fill="#fafaf6"/><g font-family="&#x27;Noto Sans CJK JP&#x27;,&#x27;Yu Gothic&#x27;,sans-serif"><text x="24" y="42" font-size="32" fill="#23332b" font-weight="700" text-anchor="start">パスキーでログインする流れ</text>
<text x="24" y="86" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">登録済み：認証器側に秘密鍵／サイト側に公開鍵。本人確認は必須。</text>
<g id="site-challenge" data-box="24,132,712,137"><rect x="24" y="132" width="712" height="137" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="167" font-size="29" fill="#426449" font-weight="700" text-anchor="start">1 サイト：shop.example</text>
<text x="42" y="202" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">今回のチャレンジを作る。</text>
<text x="42" y="238" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">予測できない確認用データ。</text>
</g>
<path data-from="site-challenge" data-to="browser-check" d="M52 276 L52 348" fill="none" stroke="#557b60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="301" font-size="23" fill="#557b60" font-weight="400" text-anchor="start">チャレンジ＋RP ID</text>
<g id="browser-check" data-box="24,357,712,137"><rect x="24" y="357" width="712" height="137" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="392" font-size="29" fill="#426449" font-weight="700" text-anchor="start">2 ブラウザー</text>
<text x="42" y="427" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">利用先とRP IDの対応を検証。</text>
<text x="42" y="463" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">チャレンジ・originなどからclientDataJSONを作る。</text>
</g>
<path data-from="browser-check" data-to="authenticator-sign" d="M52 501 L52 573" fill="none" stroke="#557b60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="526" font-size="23" fill="#557b60" font-weight="400" text-anchor="start">RP ID＋clientDataJSONのハッシュ</text>
<g id="authenticator-sign" data-box="24,582,712,173"><rect x="24" y="582" width="712" height="173" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="617" font-size="29" fill="#426449" font-weight="700" text-anchor="start">3 認証器（端末内）</text>
<text x="42" y="652" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">指紋・顔やPINで本人確認し、秘密鍵で署名。</text>
<text x="42" y="688" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">署名対象：認証器データ＋clientDataJSONのハッシュ。</text>
<text x="42" y="724" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">秘密鍵・生体情報はログイン先へ送らない。</text>
</g>
<path data-from="authenticator-sign" data-to="site-verify" d="M52 762 L52 834" fill="none" stroke="#557b60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="787" font-size="23" fill="#557b60" font-weight="400" text-anchor="start">署名＋認証器データ＋clientDataJSON（ブラウザー経由）</text>
<g id="site-verify" data-box="24,843,712,173"><rect x="24" y="843" width="712" height="173" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="878" font-size="29" fill="#426449" font-weight="700" text-anchor="start">4 サイト：shop.example</text>
<text x="42" y="913" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">公開鍵で署名を検証。チャレンジ・origin、</text>
<text x="42" y="949" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">RP IDのハッシュ、操作・本人確認結果なども検証。</text>
<text x="42" y="985" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">条件が合えばログイン。</text>
</g>
<text x="24" y="1038" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">通信・拡張機能の細部は省略。別端末・同期の形態は本文を参照。</text></g></svg>