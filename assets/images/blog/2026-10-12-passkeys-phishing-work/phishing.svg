<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1056" width="760" height="1056" role="img" aria-labelledby="title desc"><title id="title">偽サイトでのパスワードとパスキーの違い</title><desc id="desc">パスワードと手入力のワンタイムコードは偽サイトで盗まれ、本物へ中継され得る。パスキーは無関係な偽サイトで本物のRP IDを使う要求をブラウザーが拒否する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#557b60"/></marker></defs><rect width="760" height="1056" rx="18" fill="#fafaf6"/><g font-family="&#x27;Noto Sans CJK JP&#x27;,&#x27;Yu Gothic&#x27;,sans-serif"><text x="24" y="42" font-size="32" fill="#23332b" font-weight="700" text-anchor="start">偽サイトに誘導されたら？</text>
<text x="24" y="86" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">本物：shop.example／偽物：shop-login.example</text>
<g id="otp-fake" data-box="24,132,712,137"><rect x="24" y="132" width="712" height="137" rx="14" fill="#fcf0e9" stroke="#90523b" stroke-width="2"/>
<text x="42" y="167" font-size="29" fill="#90523b" font-weight="700" text-anchor="start">パスワード＋ワンタイムコードの場合</text>
<text x="42" y="202" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">利用者が偽サイトに入力。</text>
<text x="42" y="238" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">偽サイトがパスワードやコードを受け取る。</text>
</g>
<path data-from="otp-fake" data-to="otp-real" d="M52 276 L52 348" fill="none" stroke="#557b60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="301" font-size="23" fill="#557b60" font-weight="400" text-anchor="start">攻撃者が有効な間に本物へ中継</text>
<g id="otp-real" data-box="24,357,712,101"><rect x="24" y="357" width="712" height="101" rx="14" fill="#fcf0e9" stroke="#90523b" stroke-width="2"/>
<text x="42" y="392" font-size="29" fill="#90523b" font-weight="700" text-anchor="start">本物のサイト</text>
<text x="42" y="427" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">受け取った値で攻撃者がログインできる可能性がある。</text>
</g>
<g id="passkey-fake" data-box="24,490,712,101"><rect x="24" y="490" width="712" height="101" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="525" font-size="29" fill="#426449" font-weight="700" text-anchor="start">パスキーの場合</text>
<text x="42" y="560" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">偽サイトが本物のRP ID、shop.exampleで処理を要求。</text>
</g>
<path data-from="passkey-fake" data-to="browser-reject" d="M52 598 L52 670" fill="none" stroke="#557b60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="623" font-size="23" fill="#557b60" font-weight="400" text-anchor="start">ブラウザーが利用先とRP IDの対応を検証</text>
<g id="browser-reject" data-box="24,679,712,137"><rect x="24" y="679" width="712" height="137" rx="14" fill="#edf3eb" stroke="#426449" stroke-width="2"/>
<text x="42" y="714" font-size="29" fill="#426449" font-weight="700" text-anchor="start">× ブラウザーが拒否</text>
<text x="42" y="749" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">無関係な偽サイトは、本物のRP IDを使えない。</text>
<text x="42" y="785" font-size="25" fill="#23332b" font-weight="400" text-anchor="start">本物用の鍵による署名は、この要求では得られない。</text>
</g>
<text x="24" y="838" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">偽物自身のRP IDを使っても、本物用の鍵は対応しない。</text>
<text x="24" y="874" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">本物側もorigin・チャレンジ・RP IDハッシュ・署名を検証する。</text>
<text x="24" y="950" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">正しく実装された認証の例。復旧・別の認証・端末侵害、</text>
<text x="24" y="986" font-size="22" fill="#52675a" font-weight="400" text-anchor="start">ログイン後の被害は別の問題。</text></g></svg>