<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">送信時の通信を守る</title><desc id="desc">送信者のメールソフトから送信元サーバーまでの投稿区間をTLSで保護する例。SMTPの投稿には、TCP 587番でSTARTTLSを使ってTLSに切り替えてから本文を送る方法と、TCP 465番で接続時からImplicit TLSを使う方法がある。この例では送信元サーバーから受信サーバーへのSMTP転送（TCP 25番）と、受信者のメールソフトによるIMAPでの取得（TCP 143番）は平文。矢印はメールの流れを示す。</desc>
